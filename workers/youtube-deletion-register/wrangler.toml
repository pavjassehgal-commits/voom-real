# VOOM YouTube deletion register — Cloudflare Workers Free + D1.
# NOT deployed. Fill database_id after `wrangler d1 create`, never commit secrets.
# Secrets (wrangler secret put): JOURNAL_TOKEN, ALERT_TOKEN, REPLAY_TOKEN,
#   RESEND_API_KEY, and optionally *_TOKEN_NEXT during rotation.
name = "voom-youtube-deletion-register"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false
send_metrics = false

[triggers]
crons = ["17 * * * *"] # hourly watchdog (1 of the 5 Free-plan cron triggers)

[[d1_databases]]
binding = "DB"
database_name = "voom-youtube-deletion-register"
database_id = "REPLACE_AFTER_D1_CREATE"

[vars]
ALERT_FROM = "REPLACE: verified Resend sender, e.g. VOOM Alerts <alerts@voom.today>"
ALERT_TO = "REPLACE: primary operator inbox(es), comma-separated"
ALERT_ESCALATE_TO = "REPLACE: deputy inbox(es) for urgent alerts"
DAILY_WRITE_BUDGET = "100000"
REQUIRE_VOOM_HEARTBEAT = "false" # set "true" once Production sends heartbeats
# RETENTION_DAYS: intentionally unset. Nothing is purged until an approved period is configured.

[observability]
enabled = true

# ---------------------------------------------------------------------------
# STAGING ONLY — isolated Worker, D1 database and tokens. Deploy with --env staging.
# Alerts email the owner's monitored inbox only once RESEND_API_KEY is set as a
# staging secret; subjects carry "STAGING" so tests are never mistaken for Production.
[env.staging]
name = "voom-ydr-staging-9b81c8"
account_id = "87dffc51b11e876e35a70f87e2a25d12"
workers_dev = true
preview_urls = false

[env.staging.triggers]
crons = ["17 * * * *"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "voom-ydr-staging"
database_id = "741cb589-dcaf-454c-b37f-40267e71de64"

[env.staging.vars]
ALERT_FROM = "VOOM Alerts <no-reply@voom.today>"
ALERT_TO = "no-reply@voom.today"
ALERT_ESCALATE_TO = ""
ALERT_ENVIRONMENT = "STAGING"
DAILY_WRITE_BUDGET = "100000"
REQUIRE_VOOM_HEARTBEAT = "false"

[env.staging.observability]
enabled = true

# ---------------------------------------------------------------------------
# PRODUCTION — not created yet. Deploy ONLY with --env production after approval.
# Fill database_id from `wrangler d1 create voom-ydr-production`; set real alert
# recipients (named by the owner) and RESEND_API_KEY as a secret before deploying.
# The top-level config above has a placeholder database_id, so a deploy without
# --env fails instead of creating an unintended Worker.
[env.production]
name = "voom-ydr-production-8a50fc"
account_id = "87dffc51b11e876e35a70f87e2a25d12"
workers_dev = true
preview_urls = false

[env.production.triggers]
crons = ["17 * * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "voom-ydr-production"
database_id = "20c4c662-7e4b-4979-93b9-ae18a47a7e4d"

[env.production.vars]
ALERT_FROM = "VOOM Alerts <no-reply@voom.today>"
ALERT_TO = "no-reply@voom.today"
ALERT_ESCALATE_TO = "" # add a deputy inbox when one exists
DAILY_WRITE_BUDGET = "100000"
REQUIRE_VOOM_HEARTBEAT = "false"

[env.production.observability]
enabled = true
